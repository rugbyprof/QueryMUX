[project]
name = "querymux"
version = "0.1.0"
description = "A split-screen terminal tool for running a query and seeing the results or error, across pluggable database backends."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.58",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "sqlparse>=0.5",
]

[project.scripts]
querymux = "querymux.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
